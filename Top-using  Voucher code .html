
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voucher Redeem</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:#e8e8e8;
display:flex;
justify-content:center;
align-items:center;
padding:24px;
overflow:hidden;
position:relative;
}

/* ================= BACKGROUND BLOBS ================= */



/* BACK BUTTON BLUE GLOW BLOB */
.back-blob{
position:absolute;
top:18px;
left:18px;
width:70px;
height:70px;
background:rgba(255, 0, 157, 0.35);
border-radius:30% 70% 60% 40% / 50% 40% 60% 50%;
filter:blur(2px);
animation:backPop 2.8s ease-in-out infinite;
z-index:1;
}

/* PINK INNER GLOW INSIDE BLUE */
.back-blob::after{
content:'';
position:absolute;
inset:10px;
background:#d266aa59;
border-radius:40% 60% 50% 50% / 60% 40% 60% 40%;
filter:blur(4px);
animation:pinkPulse 3.5s ease-in-out infinite;
}

/* BACK BUTTON */
.back-btn{
position:absolute;
top:22px;
left:22px;
width:45px;
height:45px;
border:none;
border-radius:12px;
background:white;
color:rgb(0, 0, 0);
font-size:22px;
cursor:pointer;
z-index:3;
backdrop-filter:blur(10px);
transition:.3s;
}

.back-btn:hover{
transform:scale(1.1);
}

/* ================= CARD ================= */

.card{
width:100%;
max-width:430px;
padding:34px;
border-radius:36px;
background:linear-gradient(135deg,#1a0055,#4316a7,#8b2cff);
color:white;
box-shadow:0 30px 60px rgba(83,0,255,.25);
position:relative;
overflow:hidden;
text-align: center;
}
.card:hover{
transform:translateY(-2px) scale(1.03);
 box-shadow: 0 10px 50px rgba(59, 6, 146, 0.6);
}

/* floating light circle */
.card::before{
content:"";
position:absolute;
width:240px;
height:240px;
background:rgba(255,255,255,.06);
border-radius:50%;
top:-100px;
right:-100px;
}

/* ================= CONTENT ================= */

.logo{
height: 60px;
}

h1{
font-size:22px;
margin-bottom:8px;
}

.subtitle{
opacity:.8;
margin-bottom:28px;
font-size: 14px;
}

/* ================= INPUT ================= */

.input-group input{
width:100%;
padding:18px 20px;
border-radius:18px;
border:2px solid rgb(255, 0, 140) ;
background:rgba(255, 255, 255,);
outline:none;
color:rgb(255, 255, 255);
font-size:16px;
font-weight:500;
transition:.35s;
}

.input-group input:focus,
.input-group input:not(:placeholder-shown){

background:rgb(255, 255, 255);
border:3px solid #00ff88;
color:#218657;
font-weight:700;
box-shadow:0 0 25px rgba(0, 0, 0, 0.35);
}

/* ================= BUTTON ================= */

.redeem-btn{
width:95%;
margin-top:15px;
text-align: center;
padding:18px;
border:none;
border-radius:18px;
font-size:17px;
font-weight:700;
cursor:pointer;
color:#260052;
background:linear-gradient(90deg,#ff0059,#de237d,#e64273);
background-size:300% 300%;
animation:goldMove 4s linear infinite;
transition:.3s;
}

.redeem-btn:hover{
transform:translateY(-2px) scale(1.03);
border:2px solid #00ff88;
}

.redeem-btn:active{
transform:scale(.97);
}

/* ================= ANIMATIONS ================= */

@keyframes goldMove{
0%{background-position:0%}
100%{background-position:100%}
}

@keyframes blob1{
0%,100%{transform:translate(0,0) scale(1);}
50%{transform:translate(-80px,-60px) scale(1.2);}
}

@keyframes blob2{
0%,100%{transform:translate(0,0);}
50%{transform:translate(90px,-40px);}
}

@keyframes blob3{
0%,100%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.25);}
}

/* BACK BUTTON POP ANIMATION */
@keyframes backPop{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.15) translateY(-3px);
}
}

/* PINK INNER PULSE */
@keyframes pinkPulse{
0%,100%{
opacity:.4;
transform:scale(1);
}
50%{
opacity:.8;
transform:scale(1.2);
}
}

/* ================= INFO ================= */

.info{
margin-top:24px;
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
text-align:left;
}

.info ul{
padding-left:18px;
}

/* ================= POPUP ================= */

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(.5);
opacity:0;
background:white;
padding:28px;
border-radius:24px;
width:90%;
max-width:340px;
text-align:center;
transition:.35s;
pointer-events:none;
box-shadow:0 25px 60px rgba(0,0,0,.25);
}

.popup.show{
opacity:1;
pointer-events:auto;
transform:translate(-50%,-50%) scale(1);
}

.popup h2{color:#17b85d;}

.tick{font-size:60px;}

.popup button{
margin-top:16px;
padding:12px 28px;
border:none;
border-radius:12px;
background:#17b85d;
color:white;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<!-- BACKGROUND BLOBS -->
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="card">

<!-- BACK BUTTON BLOBS -->
<div class="back-blob"></div>
<button class="back-btn" onclick="goBack()"><b>←</b></button>

<div class="logo"></div>

<h1>Redeem Voucher</h1>
<p class="subtitle">Enter code to credit wallet instantly</p>
<h5 style=" color: tomato;  margin-bottom: 6px;">Capitel Letter Only (A-Z) </h5>
<div class="input-group">
<input id="voucher" type="text" placeholder="Enter Voucher Code">
</div>

<button class="redeem-btn" onclick="redeem()"> Redeem Voucher</button>

<div class="info">
<ul>
<li>One-time use only</li>
<li>Instant credit</li>
<li>Secure validation</li>
</ul>
</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="tick">✅</div>
<h2>Success</h2>
<p>Voucher applied successfully</p>
<button onclick="closePopup()">OK</button>
</div>

<script>

function goBack(){
history.back();
}
const input = document.getElementById("voucher");

input.addEventListener("keypress", function(e) {
  const char = e.key;

  if (/[a-z]/.test(char)) {
    e.preventDefault();
    alert("Capital letters only!");
  }
});

function redeem(){
let v=document.getElementById("voucher").value.trim();
if(!v){
alert("Enter voucher code");
return;
}
document.getElementById("popup").classList.add("show");
}

function closePopup(){
document.getElementById("popup").classList.remove("show");
}

</script>

</body>
</html>
